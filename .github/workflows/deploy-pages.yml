name: Deploy Fourth Bedroom 2.22

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pages.yml'
      - '404.html'
      - 'CREDITS_AND_SOURCES.md'
      - 'RELEASE_NOTES_V220.md'
      - 'RELEASE_NOTES_V221.md'
      - 'RELEASE_NOTES_V222.md'
      - 'asset-manifest.json'
      - 'assets/backgrounds-v222/**'
      - 'data/game-data.js'
      - 'game.js'
      - 'index.html'
      - 'service-worker.js'
      - 'site.webmanifest'
      - 'styles.css'
      - 'version.json'
      - 'UPLOAD_TO_REPOSITORY_ROOT/deploy_bundle_v219/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reconstruct verified 2.19 base
        shell: bash
        run: |
          set -euo pipefail
          BASE="$GITHUB_WORKSPACE/UPLOAD_TO_REPOSITORY_ROOT/deploy_bundle_v219"
          test -d "$BASE"
          cd "$BASE"
          sha256sum -c PART_SHA256SUMS.txt
          cat site_v219.zip.part-* > /tmp/site_v219.zip
          EXPECTED="$(awk '{print $1}' RECONSTRUCTED_ZIP_SHA256.txt)"
          echo "${EXPECTED}  /tmp/site_v219.zip" | sha256sum -c -

          cd "$GITHUB_WORKSPACE"
          rm -rf _site
          mkdir _site
          unzip -q /tmp/site_v219.zip -d _site

      - name: Apply current root release files
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          for file in \
            404.html \
            CREDITS_AND_SOURCES.md \
            RELEASE_NOTES_V220.md \
            asset-manifest.json \
            game.js \
            index.html \
            service-worker.js \
            site.webmanifest \
            styles.css \
            version.json; do
            test -f "$file"
            cp "$file" "_site/$file"
          done

          for optional in RELEASE_NOTES_V221.md RELEASE_NOTES_V222.md; do
            if test -f "$optional"; then
              cp "$optional" "_site/$optional"
            fi
          done

          test -f data/game-data.js
          mkdir -p _site/data
          cp data/game-data.js _site/data/game-data.js

          if test -d assets/backgrounds-v222; then
            mkdir -p _site/assets/backgrounds-v222
            cp -R assets/backgrounds-v222/. _site/assets/backgrounds-v222/
          fi

      - name: Verify current package
        shell: bash
        run: |
          set -euo pipefail
          node --check _site/game.js
          node --check _site/data/game-data.js
          node --check _site/service-worker.js

          TARGET_VERSION="$(python - <<'PY'
          import json
          print(json.load(open('_site/version.json', encoding='utf-8'))['version'])
          PY
          )"

          case "$TARGET_VERSION" in
            2.21.0)
              test -f _site/RELEASE_NOTES_V221.md
              grep -q 'VERSION 2.21.0' _site/index.html
              ;;
            2.22.0)
              test -f _site/RELEASE_NOTES_V222.md
              grep -q 'VERSION 2.22.0' _site/index.html
              grep -q 'VISUAL REMASTER / BACKGROUND REBUILD' _site/index.html
              test -d _site/assets/backgrounds-v222
              test "$(find _site/assets/backgrounds-v222 -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 33
              grep -q 'backgrounds-v222/train-night.webp' _site/styles.css
              grep -q 'backgrounds-v222/painted-bedroom.webp' _site/styles.css
              grep -q 'backgrounds-v222/comparison-room.webp' _site/styles.css
              ;;
            *)
              echo "ERROR: unsupported release $TARGET_VERSION" >&2
              exit 1
              ;;
          esac

          grep -q 'id="new-game"' _site/index.html
          grep -Fq "\$('#new-game').addEventListener" _site/game.js
          grep -q 'id="objective-ribbon"' _site/index.html
          grep -q 'id="log-dialog"' _site/index.html

          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re

          root = Path('_site')
          release = json.loads((root / 'version.json').read_text(encoding='utf-8'))['version']
          manifest = json.loads((root / 'asset-manifest.json').read_text(encoding='utf-8'))
          assert manifest['version'] == release
          assert manifest['fileCount'] == len(manifest['files']) + 1

          for item in manifest['files']:
              path = root / item['path']
              assert path.is_file(), item['path']
              assert path.stat().st_size == item['size'], item['path']
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert digest == item['sha256'], item['path']

          source = (root / 'data/game-data.js').read_text(encoding='utf-8')
          assert source.startswith('window.GAME_DATA=')
          data = json.loads(source[len('window.GAME_DATA='):].rstrip().rstrip(';'))
          assert data['meta']['version'] == release
          assert len(data['nodes']) == 730
          assert len(data['evidence']) == 173
          assert len(data['gameovers']) == 25
          assert sum(node.get('type') == 'ending' for node in data['nodes']) == 5

          node_ids = {node['id'] for node in data['nodes']}
          invalid = []
          for node in data['nodes']:
              targets = []
              if node.get('next'):
                  targets.append(node['next'])
              targets.extend(choice['next'] for choice in node.get('choices', []) if choice.get('next'))
              if node.get('type') == 'deathSequence' and node.get('death'):
                  target = data['gameovers'].get(node['death'], {}).get('returnTo')
                  if target:
                      targets.append(target)
              invalid.extend((node['id'], target) for target in targets if target not in node_ids)
          assert not invalid, invalid

          if release == '2.22.0':
              bg_dir = root / 'assets/backgrounds-v222'
              files = sorted(bg_dir.glob('*.webp'))
              assert len(files) == 33
              css = (root / 'styles.css').read_text(encoding='utf-8')
              refs = set(re.findall(r'assets/backgrounds-v222/[^")]+\.webp', css))
              assert len(refs) == 33, len(refs)
              for ref in refs:
                  assert (root / ref).is_file(), ref

          print(f"PASS: release {release}, {len(data['nodes'])} nodes and {len(manifest['files'])} files verified")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload verified site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
          reporting_interval: 10000
