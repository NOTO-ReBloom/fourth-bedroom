name: Deploy Fourth Bedroom 2.20

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pages.yml'
      - 'RELEASE_NOTES_V220.md'
      - 'asset-manifest.json'
      - 'data/game-data.js'
      - 'game.js'
      - 'index.html'
      - 'service-worker.js'
      - 'site.webmanifest'
      - 'styles.css'
      - 'version.json'
      - 'UPLOAD_TO_REPOSITORY_ROOT/deploy_bundle_v219/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reconstruct 2.19 base
        shell: bash
        run: |
          set -euo pipefail
          BASE="$GITHUB_WORKSPACE/UPLOAD_TO_REPOSITORY_ROOT/deploy_bundle_v219"
          test -d "$BASE"
          cd "$BASE"
          sha256sum -c PART_SHA256SUMS.txt
          cat site_v219.zip.part-* > /tmp/site_v219.zip
          EXPECTED="$(awk '{print $1}' RECONSTRUCTED_ZIP_SHA256.txt)"
          echo "${EXPECTED}  /tmp/site_v219.zip" | sha256sum -c -

          cd "$GITHUB_WORKSPACE"
          rm -rf _site
          mkdir _site
          unzip -q /tmp/site_v219.zip -d _site

      - name: Apply uploaded 2.20 files from repository root
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          for file in \
            RELEASE_NOTES_V220.md \
            asset-manifest.json \
            game.js \
            index.html \
            service-worker.js \
            site.webmanifest \
            styles.css \
            version.json; do
            test -f "$file"
            cp "$file" "_site/$file"
          done

          test -f data/game-data.js
          mkdir -p _site/data
          cp data/game-data.js _site/data/game-data.js

      - name: Verify 2.20 package and offline assets
        shell: bash
        run: |
          set -euo pipefail
          node --check _site/game.js
          node --check _site/data/game-data.js
          node --check _site/service-worker.js

          grep -q 'VERSION 2.20.0' _site/index.html
          grep -q 'CACHE_ALL_ASSETS' _site/service-worker.js
          grep -q 'portrait-emotion' _site/game.js
          grep -q 'id="new-game"' _site/index.html
          grep -Fq "\$('#new-game').addEventListener" _site/game.js

          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root = Path('_site')
          manifest = json.loads((root / 'asset-manifest.json').read_text(encoding='utf-8'))
          assert manifest['version'] == '2.20.0'
          assert len(manifest['files']) >= 270

          for item in manifest['files']:
              path = root / item['path']
              assert path.is_file(), item['path']
              assert path.stat().st_size == item['size'], item['path']
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert digest == item['sha256'], item['path']

          game_data = (root / 'data/game-data.js').read_text(encoding='utf-8')
          assert game_data.count('"id":"') >= 730
          assert '"version":"2.20.0"' in game_data
          print(f"PASS: {len(manifest['files'])} files verified")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload verified site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
